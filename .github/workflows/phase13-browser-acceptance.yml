name: Phase 13 browser acceptance

on:
  push:
    branches:
      - main
      - phase-13-browser-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright --version
          npx playwright install --with-deps chromium firefox webkit
      - name: Run deployed-site browser acceptance
        env:
          PHASE13_URL: https://knightfox789.github.io/weir-web-article/
          PHASE13_OUT: phase13-artifacts
        run: node scripts/qa_phase13_browser.js
      - name: Upload Phase 13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-browser-evidence
          path: phase13-artifacts/
          if-no-files-found: error
